<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1,
    user-scalable=no, viewport-fit=cover"
  >

  <title>Eye Tracker</title>

  <script src="https://cdn.jsdelivr.net/npm/webgazer@3.5.3/dist/webgazer.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      touch-action: manipulation;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
      background: #111;
      z-index: 1000;
    }

    #startButton {
      font-size: 24px;
      padding: 18px 28px;
      border-radius: 14px;
      border: none;
      margin-top: 20px;
    }

    #status {
      position: fixed;
      top: max(15px, env(safe-area-inset-top));
      left: 10%;
      width: 80%;
      text-align: center;
      font-size: 18px;
      background: rgba(0,0,0,.7);
      padding: 8px;
      border-radius: 10px;
      z-index: 900;
      pointer-events: none;
    }

    #target {
      position: fixed;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: #00e676;
      border: 5px solid white;
      transform: translate(-50%, -50%);
      display: none;
      align-items: center;
      justify-content: center;
      color: black;
      font-size: 22px;
      font-weight: bold;
      z-index: 950;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    /* Our large gaze visualization */
    #gazeDot {
      position: fixed;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: red;
      border: 3px solid white;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
      z-index: 999;
    }

    #recalibrate {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 18px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      display: none;
      z-index: 1000;
    }
  </style>
</head>


<body>

<div id="startScreen">

  <h1>Eye Tracker</h1>

  <p>
    Hold the device normally.<br>
    Keep your head reasonably still.
    <br><br>
    Look directly at each green circle and tap it 5 times.
  </p>

  <button id="startButton">
    Start Eye Tracking
  </button>

</div>


<div id="status"></div>

<div id="target"></div>

<div id="gazeDot"></div>

<button id="recalibrate">
  Recalibrate
</button>


<script>

const startScreen =
  document.getElementById("startScreen");

const startButton =
  document.getElementById("startButton");

const target =
  document.getElementById("target");

const status =
  document.getElementById("status");

const gazeDot =
  document.getElementById("gazeDot");

const recalibrateButton =
  document.getElementById("recalibrate");


const calibrationPoints = [

  [15, 20],
  [50, 20],
  [85, 20],

  [15, 50],
  [50, 50],
  [85, 50],

  [15, 80],
  [50, 80],
  [85, 80]

];


const clicksPerPoint = 5;

let currentPoint = 0;
let clicksAtPoint = 0;

let tracking = false;
let started = false;


/* =========================
   START WEBGAZER
   ========================= */

startButton.addEventListener("click", async () => {

  if (started) return;

  started = true;

  startButton.disabled = true;

  startButton.innerText =
    "Starting camera...";

  status.innerText =
    "Allow camera access";


  try {

    /*
      Don't restore calibration from an
      earlier browser session.
    */

    webgazer.saveDataAcrossSessions(false);


    await webgazer

      .setRegression("ridge")

      .setGazeListener((data) => {

        if (!data) return;

        /*
          Only display our red dot once
          calibration has finished.
        */

        if (!tracking) return;


        let x = data.x;
        let y = data.y;


        /*
          Keep dot inside the screen.
        */

        x = Math.max(
          0,
          Math.min(window.innerWidth, x)
        );

        y = Math.max(
          0,
          Math.min(window.innerHeight, y)
        );


        gazeDot.style.left =
          x + "px";

        gazeDot.style.top =
          y + "px";


        gazeDot.style.display =
          "block";

      })

      .begin();


    /*
      Camera + face box.
    */

    webgazer.showVideoPreview(true);

    webgazer.showFaceOverlay(true);

    webgazer.showFaceFeedbackBox(true);


    /*
      Hide WebGazer's prediction point
      UNTIL calibration is completed.
    */

    webgazer.showPredictionPoints(false);


    /*
      Slightly smooth predictions.
    */

    if (webgazer.applyKalmanFilter) {

      webgazer.applyKalmanFilter(true);

    }


    /*
      Clear old calibration.
    */

    webgazer.clearData();


    /*
      We manually feed calibration points,
      so prevent WebGazer from learning
      from random clicks elsewhere.
    */

    if (webgazer.removeMouseEventListeners) {

      webgazer.removeMouseEventListeners();

    }


    startScreen.style.display =
      "none";


    status.innerText =
      "Camera ready — keep your face visible";


    /*
      Let face tracking stabilize briefly.
    */

    setTimeout(() => {

      beginCalibration();

    }, 1500);


  }

  catch (error) {

    console.error(error);

    status.innerText =
      "ERROR: " + error.message;

    startButton.disabled = false;

    startButton.innerText =
      "Try Again";

    started = false;

  }

});


/* =========================
   START CALIBRATION
   ========================= */

function beginCalibration() {

  tracking = false;

  gazeDot.style.display =
    "none";

  webgazer.showPredictionPoints(false);


  recalibrateButton.style.display =
    "none";


  currentPoint = 0;

  clicksAtPoint = 0;


  /*
    Throw away previous calibration.
  */

  webgazer.clearData();


  status.innerText =
    "LOOK directly at the green circle and tap it 5 times";


  showCalibrationPoint();

}


/* =========================
   DISPLAY TARGET
   ========================= */

function showCalibrationPoint() {

  const point =
    calibrationPoints[currentPoint];


  target.style.left =
    point[0] + "%";

  target.style.top =
    point[1] + "%";


  clicksAtPoint = 0;


  target.innerText =
    clicksPerPoint;


  target.style.display =
    "flex";

}


/* =========================
   CALIBRATION TAP
   ========================= */

target.addEventListener(
  "pointerdown",

  (event) => {

    event.preventDefault();


    if (tracking) return;


    const rect =
      target.getBoundingClientRect();


    const x =
      rect.left +
      rect.width / 2;


    const y =
      rect.top +
      rect.height / 2;


    /*
      Explicitly tell WebGazer:
      eyes are looking at (x,y).
    */

    webgazer.recordScreenPosition(
      x,
      y,
      "click"
    );


    clicksAtPoint++;


    const remaining =
      clicksPerPoint -
      clicksAtPoint;


    if (remaining > 0) {

      target.innerText =
        remaining;

      return;

    }


    /*
      Move to next calibration point.
    */

    target.style.display =
      "none";


    currentPoint++;


    if (
      currentPoint <
      calibrationPoints.length
    ) {

      status.innerText =
        "Good — look at the next circle";


      setTimeout(() => {

        showCalibrationPoint();

      }, 300);

    }

    else {

      finishCalibration();

    }

  }
);


/* =========================
   CALIBRATION FINISHED
   ========================= */

function finishCalibration() {

  target.style.display =
    "none";


  tracking = true;


  /*
    Our red dot
  */

  gazeDot.style.display =
    "block";


  /*
    ALSO show WebGazer's own built-in
    gaze prediction visualization.

    This is useful for debugging:
    BOTH dots should move with your gaze.
  */

  webgazer.showPredictionPoints(true);


  recalibrateButton.style.display =
    "block";


  status.innerText =
    "CALIBRATED — move your eyes around the screen";


  setTimeout(() => {

    status.innerText = "";

  }, 3000);

}


/* =========================
   RECALIBRATE
   ========================= */

recalibrateButton.addEventListener(
  "click",

  () => {

    status.innerText =
      "Recalibrating...";


    setTimeout(() => {

      beginCalibration();

    }, 300);

  }
);


/* Prevent accidental double-tap zoom */

let lastTouchEnd = 0;

document.addEventListener(
  "touchend",

  (event) => {

    const now =
      Date.now();


    if (
      now - lastTouchEnd <= 300
    ) {

      event.preventDefault();

    }


    lastTouchEnd =
      now;

  },

  false
);

</script>

</body>
</html>
